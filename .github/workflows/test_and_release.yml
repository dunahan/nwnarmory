name: Rust Multi-Platform CI & Release

on:
  # Triggers the workflow (tests only) on every new or updated pull request
  pull_request:
    branches: [ "main" ]
  # Triggers the workflow (tests + release) on every push/merge directly to the main branch
  push:
    branches: [ "main" ]
  # Allows manual triggering via the GitHub interface
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nwnarmory-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # JOB 1: Testing
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Install the Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Enable Rust cache
      uses: swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --offline -- -D warnings

    - name: Run tests
      run: cargo test --offline --verbose

  # JOB 2: Checks the Cargo.toml version AND extracts the changelog
  check-version:
    name: Check Version & Changelog
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      is_new: ${{ steps.check_tag.outputs.is_new }}
    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Read version
      id: extract
      run: |
        VERSION=$(grep -m 1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
        echo "Found version: $VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Check if Tag is already existing
      id: check_tag
      run: |
        if git show-ref --tags "v${{ steps.extract.outputs.version }}" --quiet; then
          echo "Tag v${{ steps.extract.outputs.version }} is already existing, so no new release needed."
          echo "is_new=false" >> $GITHUB_OUTPUT
        else
          echo "Tag v${{ steps.extract.outputs.version }} is newer. Release will be checked in."
          echo "is_new=true" >> $GITHUB_OUTPUT
        fi

    - name: Extract changelog for release notes
      if: steps.check_tag.outputs.is_new == 'true'
      run: |
        VERSION="${{ steps.extract.outputs.version }}"

        if ! grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
          echo "::error::CHANGELOG.md has no release section for [$VERSION]"
          exit 1
        fi

        awk "/^## \[$VERSION\]/{flag=1; next} /^## /{flag=0} flag" \
          CHANGELOG.md > release_notes.txt

        if [ ! -s release_notes.txt ]; then
          echo "::error::Release notes for [$VERSION] are empty"
          exit 1
        fi

    - name: Upload release notes
      if: steps.check_tag.outputs.is_new == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: release-notes
        path: release_notes.txt

  # JOB 3: Build (Only creates the files and uploads them as an artifact)
  build:
    name: Build Release for ${{ matrix.os }}
    needs: check-version
    if: needs.check-version.outputs.is_new == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: nwnarmory
            asset_name: nwnarmory-linux.tar.gz
          - os: windows-latest
            artifact_name: nwnarmory.exe
            asset_name: nwnarmory-windows.zip

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Install the Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Enable Rust cache
      uses: swatinem/rust-cache@v2

    - name: Create release build
      run: cargo build --release --offline

    - name: Packaging (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Compress-Archive -Path target/release/${{ matrix.artifact_name }} -DestinationPath ./${{ matrix.asset_name }}

    - name: Packaging (Linux)
      if: matrix.os != 'windows-latest'
      run: |
        tar -czf ./${{ matrix.asset_name }} -C target/release ${{ matrix.artifact_name }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-asset-${{ matrix.os }}
        path: ./${{ matrix.asset_name }}

  # JOB 4: Publish Release (Runs only once and bundles the package)
  publish-release:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs: [check-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          merge-multiple: true
          path: release-assets

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-assets

      - name: Create SHA-256 checksums
        run: |
          cd release-assets
          sha256sum nwnarmory-* > SHA256SUMS.txt

      - name: Automatically create a GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ needs.check-version.outputs.version }}"
          name: "Release v${{ needs.check-version.outputs.version }}"
          body_path: release-assets/release_notes.txt
          files: |
            release-assets/nwnarmory-*
            release-assets/SHA256SUMS.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
