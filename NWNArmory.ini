;
; This .ini contains the standard racial transforms
; By Eligio Sacateca, June 2003
; Based on data compiled by Bearthing
;
; Instructions
; You should not have to make changes to this file to do
; standard racial transforms.
;
; However, some of the transforms are inexact - the Bioware
; models have been tweaked by hand for these. The model
; pieces where this occurs are indicated below with a comment
; about checking or doublechecking the values to finalize.
;


[Global]
; level 1 = basic, level 2 = debug mode
LogLevel=1
SourceDir=D:\Current\Custom\Armory\TestIn
DestDir=D:\Current\Custom\Armory\TestOut

; make sure you set this! set it to one higher than the last [sN]
nTransforms=110

